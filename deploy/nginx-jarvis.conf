# JARVIS behind nginx: the built face served from disk, the brain proxied to
# the bridge on loopback. Installed as /etc/nginx/sites-available/jarvis.
#
# Written the way certbot leaves its own sites (same ssl includes), so this is
# what the file looks like AFTER `certbot --nginx -d g1.axiosiiitl.dev`. Get the
# certificate first, then drop this in — see deploy/README.md. The whole site is
# behind HTTP basic auth: the bridge drives an agent that can read files and
# spend an API budget, and it has no login of its own.

map $http_upgrade $jarvis_connection {
    default upgrade;
    ''      close;
}

server {
    server_name g1.axiosiiitl.dev;

    root /opt/jarvis/dist;
    index index.html;

    auth_basic           "JARVIS";
    auth_basic_user_file /etc/nginx/jarvis.htpasswd;

    gzip on;
    gzip_types application/javascript text/css application/json application/wasm image/svg+xml;

    # The page and the WebSocket share one URL: the client opens
    # wss://<host>/ and the bridge answers there. A plain GET is the face; an
    # Upgrade is the brain, handed to the internal location below.
    location = / {
        if ($http_upgrade ~* "^websocket$") {
            rewrite ^ /__jarvis_ws last;
        }
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location = /__jarvis_ws {
        internal;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jarvis_connection;
        proxy_set_header Host $host;
        # A conversation is idle for long stretches; don't cut it off.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The bridge's own HTTP routes: speech in and out, reading-mode pages, the
    # picture and media proxies, and local files.
    location ~ ^/(health|file|img|media|page|tts|stt)$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Speech and media stream; buffering them delays the first byte, which
        # is the whole point of streaming.
        proxy_buffering off;
        client_max_body_size 20m;
        proxy_read_timeout 120s;
    }

    # Vite fingerprints everything under /assets, so it can be cached for good.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/g1.axiosiiitl.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/g1.axiosiiitl.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = g1.axiosiiitl.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name g1.axiosiiitl.dev;
    return 404; # managed by Certbot
}
